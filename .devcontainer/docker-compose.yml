services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    # working_dir: /app
    volumes:
      - ..:/workspace:cached
      - try-node-node_modules:/workspace/node_modules
      # - ..:/usr/config
      # - /usr/config/node_modules
    # environment:
      # - ACCEPT_EULA=Y
      # - SA_PASSWORD=P@assword123
    depends_on:
      postgres:
        condition: service_started
      mssql:
        condition: service_healthy
      mysql:
        condition: service_started
      mariadb:
        condition: service_started
      sapase:
        condition: service_started
      oracle:
        condition: service_healthy
  postgres:
    image: postgres:16.14-bookworm
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - 14332:5432
    # restart: always
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=P@assword123
      - MSSQL_SA_PASSWORD=P@assword123
    ports:
      - 14330:1433
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    #restart: always
  mysql:
    image: mysql:8.0.31
    environment:
      - MYSQL_ROOT_PASSWORD=test
      - MYSQL_DATABASE=test
      - MYSQL_USER=test
      - MYSQL_PASSWORD=test
    tmpfs:
      - /var/lib/mysql
    ports:
      - 3306:3306
    # restart: always
  mariadb:
    image: mariadb:11.4
    environment:
      - MARIADB_ROOT_PASSWORD=test
      - MARIADB_DATABASE=test
      - MARIADB_USER=test
      - MARIADB_PASSWORD=test
    tmpfs:
      - /var/lib/mysql
    ports:
      - 3307:3306
    # restart: always
  sapase:
    image: larsroald/ase-server    
    hostname: sapase
    ports:
      - 50000:5000
    # restart: always
  oracle:
    image: gvenzl/oracle-xe
    environment:
      - ORACLE_PASSWORD=P@assword123   
    hostname: oracle
    tmpfs:
      - /opt/oracle/oradata
    ports:
      - 1521:1521
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/P@assword123@localhost:1521/XE"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
volumes:
  try-node-node_modules:
